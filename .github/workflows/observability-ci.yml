name: Observability configuration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    name: Observability rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate dashboard JSON
        run: python3 -m json.tool infra/observability/dashboard.json > /dev/null
      - name: Validate Prometheus rules
        run: docker run --rm -v "$PWD/infra/observability:/work:ro" --entrypoint /bin/promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check rules /work/alerts.yml
      - name: Test alert firing and healthy cases
        run: docker run --rm -v "$PWD/infra/observability:/work:ro" -w /work --entrypoint /bin/promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 test rules /work/alerts.test.json
