name: Security analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build_mode: manual
          - language: javascript-typescript
            build_mode: none
          - language: python
            build_mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
      - name: Build Java with required tests and coverage
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -ntp clean verify
      - uses: github/codeql-action/analyze@v4
        with:
          output: security-results
          upload: never
          upload-database: false
      - name: Fail on high, critical or error-level findings
        run: python3 scripts/quality/sarif_gate.py security-results --output quality-reports/sast-${{ matrix.language }}.json
      - name: Publish analysis and gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sast-${{ matrix.language }}-${{ github.sha }}
          path: |
            security-results/
            quality-reports/
          if-no-files-found: error
          retention-days: 30
