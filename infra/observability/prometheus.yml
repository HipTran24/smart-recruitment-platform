# Reference configuration only; no real credentials or recipient is configured.
global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: smartrecruit
    scheme: https
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-jwt
    static_configs:
      - targets: ["api.example.test:443"]
