name: smart-recruitment

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env and set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  app:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: warn
      SERVER_SESSION_COOKIE_SECURE: ${SERVER_SESSION_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      APP_WEB_CORS_ALLOWED_ORIGINS: ${APP_WEB_CORS_ALLOWED_ORIGINS:-}
      APP_TEST_MAILBOX_ENABLED: ${APP_TEST_MAILBOX_ENABLED:-true}
      APP_SECURITY_JWT_ISSUER: ${APP_SECURITY_JWT_ISSUER:?Set APP_SECURITY_JWT_ISSUER in .env}
      APP_SECURITY_JWT_AUDIENCE: ${APP_SECURITY_JWT_AUDIENCE:?Set APP_SECURITY_JWT_AUDIENCE in .env}
      APP_SECURITY_JWT_KEY_ID: ${APP_SECURITY_JWT_KEY_ID:?Set APP_SECURITY_JWT_KEY_ID in .env}
      APP_SECURITY_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/app-jwt-private.pem
      APP_SECURITY_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/app-jwt-public.pem
      APP_SECURITY_JWT_ACCESS_TOKEN_TTL: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:?Set APP_SECURITY_JWT_ACCESS_TOKEN_TTL in .env}
      APP_SECURITY_JWT_REFRESH_TOKEN_TTL: ${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:?Set APP_SECURITY_JWT_REFRESH_TOKEN_TTL in .env}
      APP_SECURITY_JWT_CLOCK_SKEW: ${APP_SECURITY_JWT_CLOCK_SKEW:?Set APP_SECURITY_JWT_CLOCK_SKEW in .env}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_SUCCESS_REDIRECT_URI: ${GOOGLE_OAUTH_SUCCESS_REDIRECT_URI:-}
      GOOGLE_OAUTH_AUTHORIZATION_CODE_TTL: ${GOOGLE_OAUTH_AUTHORIZATION_CODE_TTL:-PT1M}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_CONNECT_TIMEOUT: ${GEMINI_CONNECT_TIMEOUT:-PT3S}
      GEMINI_READ_TIMEOUT: ${GEMINI_READ_TIMEOUT:-PT30S}
      GEMINI_MAX_RESUME_CHARACTERS: ${GEMINI_MAX_RESUME_CHARACTERS:-60000}
      GEMINI_MAX_JOB_DESCRIPTION_CHARACTERS: ${GEMINI_MAX_JOB_DESCRIPTION_CHARACTERS:-24000}
      GEMINI_MAX_REQUIRED_CRITERIA: ${GEMINI_MAX_REQUIRED_CRITERIA:-40}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-1024}
      GEMINI_ALLOW_INSECURE_ENDPOINT: ${GEMINI_ALLOW_INSECURE_ENDPOINT:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - app-network
    secrets:
      - source: app-jwt-private-key
        target: app-jwt-private.pem
      - source: app-jwt-public-key
        target: app-jwt-public.pem

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8443}:80"
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:

secrets:
  app-jwt-private-key:
    file: ${JWT_PRIVATE_KEY_FILE:?Set JWT_PRIVATE_KEY_FILE in .env}
  app-jwt-public-key:
    file: ${JWT_PUBLIC_KEY_FILE:?Set JWT_PUBLIC_KEY_FILE in .env}
