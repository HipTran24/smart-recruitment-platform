# HTTP Server: Chuyển hướng toàn bộ traffic sang HTTPS
server {
    listen 80;
    server_name smartrecruit.synaplearn.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: SSL / TLS 1.3 Termination với chứng chỉ Let's Encrypt
server {
    listen 443 ssl;
    server_name smartrecruit.synaplearn.online;
    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/smartrecruit.synaplearn.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrecruit.synaplearn.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend REST API calls to the Spring Boot service container
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # OpenAPI 3.1 documentation
    location /v3/api-docs {
        proxy_pass http://app:8080/v3/api-docs;
        proxy_set_header Host $http_host;
    }

    # Spring Actuator health probes
    location /actuator/ {
        proxy_pass http://app:8080/actuator/;
        proxy_set_header Host $http_host;
    }
}
