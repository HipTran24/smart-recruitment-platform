spring:
  application:
    name: smart-recruitment-test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  test-mailbox:
    enabled: true
  security:
    jwt:
      issuer: https://smart-recruitment.test
      audience: smart-recruitment-api
      key-id: test-key-2026
      private-key-location: classpath:keys/test-jwt-private.pem
      public-key-location: classpath:keys/test-jwt-public.pem
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
      clock-skew: PT30S
