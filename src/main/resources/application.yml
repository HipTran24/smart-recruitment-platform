spring:
  application:
    name: smart-recruitment
  datasource:
    # Deliberately has no local default: credentials must come from the environment
    # or a platform secret store. This makes an accidental production startup fail fast.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 2MB
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  # Keep this at `none` unless the deployment terminates TLS behind a trusted
  # proxy that strips client-supplied Forwarded/X-Forwarded-* headers.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  observations:
    key-values:
      application: ${spring.application.name}

# Optional external integrations are off until explicitly enabled. JWT signing
# configuration deliberately has no source-controlled fallback: all JWT key
# locations and issuer settings must be provided by the deployment.
app:
  test-mailbox:
    enabled: ${APP_TEST_MAILBOX_ENABLED:false}
  notification:
    provider: ${APP_NOTIFICATION_PROVIDER:logging}
  identity:
    bootstrap-admin:
      enabled: ${APP_IDENTITY_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_IDENTITY_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${APP_IDENTITY_BOOTSTRAP_ADMIN_FULL_NAME:Platform Administrator}
  web:
    cors:
      # Comma-separated exact browser origins. Empty denies browser CORS.
      allowed-origins: ${APP_WEB_CORS_ALLOWED_ORIGINS:}
  security:
    client-ip:
      trust-forwarded-header: ${APP_SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADER:false}
    oauth2:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        success-redirect-uri: ${GOOGLE_OAUTH_SUCCESS_REDIRECT_URI:}
        authorization-code-ttl: ${GOOGLE_OAUTH_AUTHORIZATION_CODE_TTL:PT1M}
  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
      api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
      api-version: ${GEMINI_API_VERSION:v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${GEMINI_READ_TIMEOUT:PT30S}
      max-resume-characters: ${GEMINI_MAX_RESUME_CHARACTERS:60000}
      max-job-description-characters: ${GEMINI_MAX_JOB_DESCRIPTION_CHARACTERS:24000}
      max-required-criteria: ${GEMINI_MAX_REQUIRED_CRITERIA:40}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
      # Reserved for isolated local provider stubs; production must stay HTTPS.
      allow-insecure-endpoint: ${GEMINI_ALLOW_INSECURE_ENDPOINT:false}
